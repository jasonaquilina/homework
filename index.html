</style></head><body>
<header><div class="wrap"><div class="brand">Biology Homework<small>MATSEC Intermediate</small></div><div id="hdr"></div></div></header>

<script>

const $app=document.getElementById('app'),$hdr=document.getElementById('hdr');

/* ---------- STUDENT ---------- */

      el('div',{},el('span',{class:'pill '+(h.status==='todo'?'todo':h.status==='submitted'?'sub':'done')},h.status==='todo'?'To do':h.status==='submitted'?'Submitted, awaiting marking':'Marked'),' ',

    if(error||!data)return show(el('div',{class:'err'},'Could not open this homework.'),el('button',{class:'btn ghost',onclick:studentHome},'Back'));

function renderForm(hw){

      const box=el('div',{class:'item'},el('div',{class:'lab'},it.label,it.marks?el('span',{class:'marks'},'  ['+it.marks+(it.marks===1?' mark':' marks')+']'):null));
      if(it.type==='multi'){ans[it.id]=[];box.append(el('div',{class:'opts'},it.options.map(o=>el('label',{},el('input',{type:'checkbox',onchange:e=>{const a=ans[it.id];e.target.checked?a.push(o):a.splice(a.indexOf(o),1)}}),o))))}

      else if(it.type==='upload'){const prev=el('div',{});const inp=el('input',{type:'file',accept:'image/*',onchange:async e=>{const f=e.target.files[0];if(!f)return;prev.replaceChildren(el('span',{class:'small'},'Preparing photo...'));try{const b=await shrink(f);photos[it.id]=b;prev.replaceChildren(el('img',{class:'photo',src:URL.createObjectURL(b)}))}catch(x){prev.replaceChildren(el('div',{class:'err'},'That file could not be read as a photo.'))}}});box.append(el('p',{class:'small'},'Take a clear photo of your drawing and add it here.'),inp,prev)}

      el('div',{class:'bar'},el('button',{class:'btn ghost',onclick:()=>m.remove()},'Go back'),el('button',{class:'btn',onclick:async()=>{m.remove();await doSubmit()}},'Yes, submit'))));
    document.body.append(m)}

      const {error}=await sb.rpc('submit_homework',{p_code:CODE,p_hw:hw.id,p_answers:ans,p_photos:paths});
      if(error)throw error;

    }catch(e){btn.disabled=false;msg.replaceChildren(el('div',{class:'err'},/already/.test(e.message||'')?'This homework has already been submitted.':'Could not submit. Please check your connection and try again.'))}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const M=1600,r=Math.min(1,M/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(),'image/jpeg',.82)};img.onerror=rej;img.src=URL.createObjectURL(file)})}

        else if(it.type==='text')row.append(el('div',{class:'small',style:'white-space:pre-wrap'},a||'(no answer)'));
        else row.append(el('div',{class:'small'},'Drawing marked by your teacher.'));
        c.append(row)});body.push(c)});

/* ---------- TEACHER ---------- */
async function teacherHome(){
  $hdr.replaceChildren();
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return teacherLogin();
  $hdr.append(el('button',{class:'lnk',onclick:async()=>{await sb.auth.signOut();teacherHome()}},'Sign out'));
  $app.classList.add('wide');
  tab='overview';renderTeacher();
}
let tab='overview';
function teacherLogin(msg){
  $app.classList.remove('wide');
  const e=el('input',{type:'email',placeholder:'Email',autocomplete:'username',style:'width:100%;max-width:320px'}),p=el('input',{type:'password',placeholder:'Password',autocomplete:'current-password',style:'width:100%;max-width:320px'});
  const go=async()=>{const {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});error?teacherLogin('Sign-in failed.'):teacherHome()};

  show(el('h1',{},'Teacher sign-in'),el('div',{class:'card'},el('div',{},e),el('div',{style:'margin-top:8px'},p),el('div',{class:'bar'},el('button',{class:'btn',onclick:go},'Sign in')),msg&&el('div',{class:'err'},msg)));

  const out=el('div',{});show(el('h1',{},'Teacher'),t,out);
  ({overview:tOverview,students:tStudents,marking:tMarking})[tab](out);

async function tOverview(out){
  const [{data:st},{data:hw},{data:sub}]=await Promise.all([sb.from('students').select('*').order('name'),sb.from('homework').select('id,title').order('id'),sb.from('submissions').select('student_id,homework_id,released')]);

  out.append(el('div',{class:'card tw'},el('table',{},el('tr',{},el('th',{},'Student'),hw.map(h=>el('th',{title:h.title},h.id))),
    st.map(s=>el('tr',{},el('td',{},s.name),hw.map(h=>{const x=get(s.id,h.id);return el('td',{},x?(x.released?'✓ marked':'✓ in'):'–')}))))),
    el('p',{class:'small'},'✓ in = submitted, waiting for you. ✓ marked = marks released to the student.'));

async function tStudents(out){

  const msg=el('div');

    el('div',{class:'card tw'},el('table',{},el('tr',{},el('th',{},'Name'),el('th',{},'Personal code (give to the student)'),el('th',{},'')),
      st.map(s=>el('tr',{},el('td',{},s.name),el('td',{},el('code',{},s.code)),el('td',{},el('button',{class:'btn ghost sm',onclick:async()=>{if(confirm('Remove '+s.name+' and all their work?')){await sb.from('students').delete().eq('id',s.id);renderTeacher()}}},'Remove')))))));

async function tMarking(out){
  const {data:hw}=await sb.from('homework').select('id,title,spec').order('id');
  const sel=el('select',{},hw.map(h=>el('option',{value:h.id},h.id+' '+h.title)));

function markCard(h,s,stu,reload){

      if(it.type==='text')row.append(el('div',{style:'white-space:pre-wrap;background:var(--field);padding:10px;border-radius:8px'},s.answers[it.id]||'(no answer)'));
      else{const p=(s.answers[it.id]||[])[0];if(p){const im=el('img',{class:'photo',alt:'drawing'});sb.storage.from('drawings').createSignedUrl(p,3600).then(({data})=>{if(data)im.src=data.signedUrl});row.append(im)}else row.append(el('div',{class:'small'},'(no photo)'))}
      row.append(el('div',{style:'margin-top:8px'},'Mark: ',el('input',{type:'number',min:0,max:it.marks,step:0.5,style:'width:80px',value:manual[it.id]??'',oninput:e=>{manual[it.id]=e.target.value===''?0:+e.target.value;upd()}}),' / '+it.marks));c.append(row)}}));
  const msg=el('span',{class:'small'});

  c.append(el('div',{class:'bar'},el('div',{},'Total: ',el('b',{},tot),' ',s.released?el('span',{class:'pill done'},'released'):null,' ',msg),el('div',{},el('button',{class:'btn ghost sm',onclick:()=>save()},'Save marks'),' ',el('button',{class:'btn sm',onclick:()=>save(!s.released)},s.released?'Hide marks':'Save & release'))));
  upd();return c;
}
